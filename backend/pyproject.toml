[project]
name = "backend"
version = "0.1.0"
description = "EventPlanner backend: регистрация на мероприятия"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "email-validator>=2.2",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Файлы на Windows-диске выглядят исполняемыми в Linux/WSL — проверка бессмысленна.
ignore = ["EXE002"]

[tool.ruff.lint.isort]
# Папка миграций называется alembic — без подсказки ruff принимает пакет за локальный.
known-third-party = ["alembic"]
